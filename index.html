<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Anika! 🎉</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    overflow-x: hidden;
    position: relative;
    opacity: 0;
    animation: pageIn 0.6s ease forwards;
  }

  @keyframes pageIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 60px 20px 100px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 3rem;
    color: #ffffff;
    text-shadow: 3px 3px 0px #ff6b9d, 6px 6px 10px rgba(0,0,0,0.15);
    margin-bottom: 10px;
    opacity: 0;
    animation: pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.1s;
  }

  h2 {
    font-size: 2.2rem;
    color: #fff;
    text-shadow: 2px 2px 0px #ff6b9d;
    margin-bottom: 30px;
    opacity: 0;
    animation: pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.3s;
  }

  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .card {
    background: rgba(255,255,255,0.85);
    border-radius: 24px;
    padding: 30px;
    margin: 25px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    backdrop-filter: blur(4px);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 36px rgba(0,0,0,0.14);
  }

  .message {
    font-size: 1.2rem;
    color: #6b3f5c;
    line-height: 1.8;
  }

  .memories h3 {
    color: #ff6b9d;
    margin-bottom: 15px;
    font-size: 1.4rem;
  }

  .memories ul {
    list-style: none;
    text-align: left;
  }

  .memories li {
    background: #fff0f5;
    margin: 10px 0;
    padding: 14px 18px;
    border-radius: 14px;
    color: #6b3f5c;
    font-size: 1.05rem;
    border-left: 5px solid #ff9ac1;
  }

  .cake {
    font-size: 5rem;
    margin: 20px 0;
    opacity: 0;
    animation: cakeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards, shake 2s infinite;
    animation-delay: 0.5s, 1.1s;
  }

  @keyframes cakeIn {
    from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes shake {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .balloon {
    position: fixed;
    bottom: -150px;
    font-size: 3rem;
    animation: rise linear infinite;
    z-index: 1;
    opacity: 0.9;
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110vh) translateX(30px) rotate(15deg); opacity: 0.3; }
  }

  button {
    position: relative;
    overflow: hidden;
    background: #ff6b9d;
    color: white;
    border: none;
    padding: 14px 34px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 6px 15px rgba(255,107,157,0.4);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.7s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(255,107,157,0.5);
  }

  button:active {
    transform: scale(0.95);
    box-shadow: 0 4px 10px rgba(255,107,157,0.4);
  }

  button .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    transform: scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes rippleEffect {
    to { transform: scale(3); opacity: 0; }
  }

  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
  <h1>🎂 শুভ জন্মদিন 🎂</h1>
  <h2>আনিকা!</h2>

  <div class="cake">🎉🎈🎁</div>

  <div class="card reveal">
    <p class="message">
      প্রিয় আনিকা,<br><br>
      জন্মদিনের অনেক অনেক শুভেচ্ছা! তুই আমার জীবনের সবচেয়ে স্পেশাল মানুষদের একজন।
      আজকের দিনটা তোর জন্য হাজারো আনন্দে ভরে উঠুক, আর আসছে বছরটা হোক তোর জন্য
      স্বপ্নপূরণের বছর। অনেক ভালোবাসা তোর জন্য! ❤️
    </p>
  </div>

  <button onclick="burst()">🎊 আরো Confetti! 🎊</button>
</div>

<script>
  // Scroll-reveal for cards
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  revealEls.forEach(el => io.observe(el));

  // Button ripple micro-interaction
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  });

  // Floating balloons
  const emojis = ['🎈','🎈','🎈','🎁','🎂'];
  const colors = ['#ff6b9d','#ffd93d','#6bcBef','#a3ff6b','#ff9ac1'];
  for (let i = 0; i < 15; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    b.style.left = Math.random()*100 + 'vw';
    b.style.animationDuration = (6 + Math.random()*6) + 's';
    b.style.animationDelay = (Math.random()*8) + 's';
    document.body.appendChild(b);
  }

  // Confetti canvas
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  let particles = [];
  const confColors = ['#ff6b9d','#ffd93d','#6bc9ef','#a3ff6b','#ff9ac1','#c893ff'];

  function createParticles(count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random()*canvas.height*0.5,
        r: 4 + Math.random()*6,
        color: confColors[Math.floor(Math.random()*confColors.length)],
        speedY: 2 + Math.random()*3,
        speedX: -1.5 + Math.random()*3,
        rotation: Math.random()*360,
        rotSpeed: -6 + Math.random()*12
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6);
      ctx.restore();
    });
    particles = particles.filter(p => p.y < canvas.height + 20);
    requestAnimationFrame(animate);
  }

  function burst() {
    createParticles(120);
  }

  createParticles(80);
  animate();
</script>

</body>
</html>
