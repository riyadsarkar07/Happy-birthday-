<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Anika! 🎉</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    overflow-x: hidden;
    position: relative;
  }

  /* ===== Intro cake animation ===== */
  #intro-screen {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #2a2550 0%, #17142f 65%, #0b0a1a 100%);
    overflow: hidden;
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  #intro-screen.fade-out {
    opacity: 0;
    transform: scale(1.06);
    pointer-events: none;
  }

  .intro-stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2.4s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }

  .intro-card {
    background: linear-gradient(160deg, #ffb6c8, #ff8fb3);
    border-radius: 22px;
    padding: 36px 30px 28px;
    width: min(80vw, 300px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    animation: cardPop 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.1s;
  }

  @keyframes cardPop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .cake-scene {
    position: relative;
    width: 150px;
    height: 130px;
    margin-bottom: 16px;
  }

  .plate {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 150px;
    height: 6px;
    background: #fff;
    border-radius: 3px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateX(-50%);
    animation: fadeIn 0.4s ease forwards;
    animation-delay: 0.1s;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .cake-layer {
    position: absolute;
    left: 50%;
    width: 110px;
    height: 22px;
    border-radius: 4px;
    opacity: 0;
  }

  .layer1 { bottom: 6px;  background: #8a5a44; animation: layerRise 0.5s cubic-bezier(0.22,1,0.36,1) forwards; animation-delay: 0.3s; }
  .layer2 { bottom: 26px; background: #a8735a; animation: layerRise 0.5s cubic-bezier(0.22,1,0.36,1) forwards; animation-delay: 0.6s; }
  .layer3 { bottom: 46px; background: #8a5a44; animation: layerRise 0.5s cubic-bezier(0.22,1,0.36,1) forwards; animation-delay: 0.9s; }
  .layer4 { bottom: 66px; background: #a8735a; animation: layerRise 0.5s cubic-bezier(0.22,1,0.36,1) forwards; animation-delay: 1.2s; }

  @keyframes layerRise {
    from { opacity: 0; transform: translate(-50%, -40px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  .frosting {
    position: absolute;
    left: 50%;
    bottom: 88px;
    width: 122px;
    height: 26px;
    background: #fffaf3;
    opacity: 0;
    transform: translateX(-50%) scale(0.7);
    clip-path: polygon(0% 0%,100% 0%,100% 55%,90% 100%,80% 50%,70% 100%,60% 50%,50% 100%,40% 50%,30% 100%,20% 50%,10% 100%,0% 55%);
    animation: frostingIn 0.5s ease forwards;
    animation-delay: 1.5s;
  }

  @keyframes frostingIn {
    to { opacity: 1; transform: translateX(-50%) scale(1); }
  }

  .candle {
    position: absolute;
    left: 50%;
    bottom: 112px;
    width: 6px;
    height: 26px;
    background: #fff8dc;
    border-radius: 2px;
    opacity: 0;
    transform: translateX(-50%);
    animation: fadeIn 0.4s ease forwards;
    animation-delay: 2.1s;
  }

  .flame {
    position: absolute;
    top: -14px;
    left: 50%;
    width: 10px;
    height: 16px;
    background: radial-gradient(circle at 50% 30%, #fff5b0, #ffb347 60%, #ff7a00);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0;
    transform: translateX(-50%);
    animation: flameIn 0.3s ease forwards, flicker 0.5s ease-in-out infinite;
    animation-delay: 2.3s, 2.6s;
  }

  @keyframes flameIn { to { opacity: 1; } }

  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(-2deg); }
    50% { transform: translateX(-50%) scale(1.08) rotate(2deg); }
  }

  .intro-text {
    color: #6b3f5c;
    font-size: 1.25rem;
    font-style: italic;
    opacity: 0;
    animation: fadeUpText 0.5s ease forwards;
    animation-delay: 2.9s;
  }

  .intro-name {
    color: #ffffff;
    font-size: 1.7rem;
    font-weight: 700;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    opacity: 0;
    margin-top: 2px;
    animation: fadeUpText 0.5s ease forwards;
    animation-delay: 3.2s;
  }

  @keyframes fadeUpText {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Main content (revealed after intro) ===== */
  #main-content {
    opacity: 0;
  }

  #main-content.show {
    animation: mainFadeIn 0.8s ease forwards;
  }

  @keyframes mainFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 60px 20px 100px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 3rem;
    color: #ffffff;
    text-shadow: 3px 3px 0px #ff6b9d, 6px 6px 10px rgba(0,0,0,0.15);
    margin-bottom: 10px;
    opacity: 0;
  }

  h2 {
    font-size: 2.2rem;
    color: #fff;
    text-shadow: 2px 2px 0px #ff6b9d;
    margin-bottom: 30px;
    opacity: 0;
  }

  #main-content.show h1 {
    animation: pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.1s;
  }

  #main-content.show h2 {
    animation: pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.3s;
  }

  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .card {
    background: rgba(255,255,255,0.85);
    border-radius: 24px;
    padding: 30px;
    margin: 25px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    backdrop-filter: blur(4px);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 36px rgba(0,0,0,0.14);
  }

  .message {
    font-size: 1.2rem;
    color: #6b3f5c;
    line-height: 1.8;
  }

  .memories h3 {
    color: #ff6b9d;
    margin-bottom: 15px;
    font-size: 1.4rem;
  }

  .memories ul {
    list-style: none;
    text-align: left;
  }

  .memories li {
    background: #fff0f5;
    margin: 10px 0;
    padding: 14px 18px;
    border-radius: 14px;
    color: #6b3f5c;
    font-size: 1.05rem;
    border-left: 5px solid #ff9ac1;
  }

  .cake {
    font-size: 5rem;
    margin: 20px 0;
    opacity: 0;
  }

  #main-content.show .cake {
    animation: cakeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards, shake 2s infinite;
    animation-delay: 0.5s, 1.1s;
  }

  @keyframes cakeIn {
    from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes shake {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .balloon {
    position: fixed;
    bottom: -150px;
    font-size: 3rem;
    animation: rise linear infinite;
    z-index: 1;
    opacity: 0.9;
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110vh) translateX(30px) rotate(15deg); opacity: 0.3; }
  }

  button {
    position: relative;
    overflow: hidden;
    background: #ff6b9d;
    color: white;
    border: none;
    padding: 14px 34px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 6px 15px rgba(255,107,157,0.4);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
    opacity: 0;
  }

  #main-content.show button {
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.7s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(255,107,157,0.5);
  }

  button:active {
    transform: scale(0.95);
    box-shadow: 0 4px 10px rgba(255,107,157,0.4);
  }

  button .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    transform: scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes rippleEffect {
    to { transform: scale(3); opacity: 0; }
  }

  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }
</style>
</head>
<body>

<div id="intro-screen">
  <div class="intro-stars" id="intro-stars"></div>
  <div class="intro-card">
    <div class="cake-scene">
      <div class="candle"><div class="flame"></div></div>
      <div class="frosting"></div>
      <div class="cake-layer layer4"></div>
      <div class="cake-layer layer3"></div>
      <div class="cake-layer layer2"></div>
      <div class="cake-layer layer1"></div>
      <div class="plate"></div>
    </div>
    <p class="intro-text">happy birthday!</p>
    <p class="intro-name">আনিকা</p>
  </div>
</div>

<div id="main-content">
<canvas id="confetti-canvas"></canvas>

<div class="container">
  <h1>🎂 শুভ জন্মদিন 🎂</h1>
  <h2>আনিকা!</h2>

  <div class="cake">🎉🎈🎁</div>

  <div class="card reveal">
    <p class="message">
      প্রিয় আনিকা,<br><br>
      জন্মদিনের অনেক অনেক শুভেচ্ছা! তুই আমার জীবনের সবচেয়ে স্পেশাল মানুষদের একজন।
      আজকের দিনটা তোর জন্য হাজারো আনন্দে ভরে উঠুক, আর আসছে বছরটা হোক তোর জন্য
      স্বপ্নপূরণের বছর। অনেক ভালোবাসা তোর জন্য! ❤️
    </p>
  </div>

  <button onclick="burst()">🎊 আরো Confetti! 🎊</button>
</div>
</div>

<script>
  // Twinkling stars for the intro
  const starsContainer = document.getElementById('intro-stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*2.4) + 's';
    starsContainer.appendChild(s);
  }

  // Button ripple micro-interaction
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  });

  function startMainExperience() {
    // Reveal main content, triggering its staggered entrance animations
    document.getElementById('main-content').classList.add('show');

    // Scroll-reveal for cards
    const revealEls = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(el => io.observe(el));

    // Floating balloons
    const emojis = ['🎈','🎈','🎈','🎁','🎂'];
    for (let i = 0; i < 15; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      b.style.left = Math.random()*100 + 'vw';
      b.style.animationDuration = (6 + Math.random()*6) + 's';
      b.style.animationDelay = (Math.random()*8) + 's';
      document.body.appendChild(b);
    }

    // Confetti canvas
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    let particles = [];
    const confColors = ['#ff6b9d','#ffd93d','#6bc9ef','#a3ff6b','#ff9ac1','#c893ff'];

    function createParticles(count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random()*canvas.height*0.5,
          r: 4 + Math.random()*6,
          color: confColors[Math.floor(Math.random()*confColors.length)],
          speedY: 2 + Math.random()*3,
          speedX: -1.5 + Math.random()*3,
          rotation: Math.random()*360,
          rotSpeed: -6 + Math.random()*12
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.rotation += p.rotSpeed;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6);
        ctx.restore();
      });
      particles = particles.filter(p => p.y < canvas.height + 20);
      requestAnimationFrame(animate);
    }

    window.burst = function() {
      createParticles(120);
    };

    createParticles(80);
    animate();
  }

  // Play the cake intro first, then fade into the main page
  const INTRO_HOLD_MS = 4300;  // time the finished cake stays on screen
  const INTRO_FADE_MS = 900;   // crossfade duration

  window.addEventListener('load', () => {
    setTimeout(() => {
      const intro = document.getElementById('intro-screen');
      intro.classList.add('fade-out');
      setTimeout(() => {
        intro.style.display = 'none';
        startMainExperience();
      }, INTRO_FADE_MS);
    }, INTRO_HOLD_MS);
  });
</script>

</body>
</html>
